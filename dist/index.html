<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPOROCYST — 宿主体内生存シミュレーション</title>
  <meta name="description" content="貝の体内でクローン群体を育て、免疫と超寄生をかわしながらセルカリアを次の宿主へ送り出す短編生態シミュレーション。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23061016'/%3E%3Cpath d='M14 34c8-18 30-20 38-5-8 18-30 20-38 5Z' fill='none' stroke='%237de5bf' stroke-width='5'/%3E%3Ccircle cx='35' cy='30' r='5' fill='%23ffcf67'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#fff4e7;--muted:#c6a99d;--bg:#170e12;--panel:#28171a;--line:#5c3438;--mint:#9be3a3;--amber:#ffd06f;--coral:#ff8a78;--cyan:#82d4ca;--violet:#be83df}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at 18% 8%,#4b2b2c 0,#241519 42%,#120b0e 100%);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh}
    button{font:inherit;color:inherit} .shell{width:min(1180px,100%);margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px}.brand{display:flex;align-items:baseline;gap:12px}.brand b{font-size:1.35rem;letter-spacing:.18em}.brand span,.day{color:var(--muted);font-size:.84rem}.day strong{color:var(--amber);font-size:1rem}
    .meters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.meter{background:#2a181dcc;border:1px solid var(--line);padding:10px 12px;border-radius:8px}.meter label{display:flex;justify-content:space-between;color:var(--muted);font-size:.76rem;letter-spacing:.05em}.meter strong{font-size:1.12rem;color:var(--ink)}.bar{height:4px;background:#4a282d;margin-top:7px;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);transition:width .35s}
    .game{display:grid;grid-template-columns:1.55fr .9fr;gap:12px}.world,.side{background:linear-gradient(145deg,#321d20f2,#211316f2);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px #0008}.world{position:relative;min-height:520px;overflow:hidden;background:#3b2424}.world-head{position:absolute;z-index:3;left:18px;top:14px;padding:7px 10px;border-radius:7px;background:#241417c9;border:1px solid #74494a}.world-head b{display:block}.world-head small{color:#e0b9aa}
    canvas{width:100%;height:100%;position:absolute;inset:0}.legend{position:absolute;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:12px;padding:6px 9px;border-radius:6px;background:#241417c9;color:#d8b5a9;font-size:.7rem}.legend i{display:inline-block;width:9px;height:5px;border-radius:50%;margin-right:5px}.side{padding:16px;display:flex;flex-direction:column;gap:14px}.brief h1{font-size:1.2rem;margin:0 0 5px}.brief p{color:var(--muted);font-size:.86rem;margin:0}.actions{display:grid;gap:8px}.action{border:1px solid var(--line);background:#382126;padding:11px 12px;border-radius:7px;text-align:left;cursor:pointer;transition:.18s}.action:hover,.action:focus-visible{border-color:var(--mint);transform:translateY(-1px);outline:none}.action b{display:flex;justify-content:space-between;font-size:.9rem}.action small{display:block;color:var(--muted);margin-top:3px}.action em{color:var(--amber);font-style:normal;font-weight:500}.release{background:var(--mint);color:#152014;border:0;border-radius:7px;padding:12px;font-weight:800;cursor:pointer}.release:disabled{background:#3b4032;color:#8c9180;cursor:not-allowed}
    .log{border-top:1px solid var(--line);padding-top:12px;min-height:145px}.log h2{font-size:.75rem;color:var(--muted);letter-spacing:.12em;margin:0 0 8px}.entry{font-size:.8rem;padding:6px 0;border-bottom:1px solid #4a292e}.entry time{color:var(--cyan);margin-right:7px}.entry.new{animation:flash 1s}@keyframes flash{from{color:var(--amber)}to{color:inherit}}
    .modal{position:fixed;inset:0;background:#10080cde;display:none;place-items:center;padding:22px;z-index:10}.modal.show{display:grid}.card{width:min(520px,100%);background:#321d22;border:1px solid #825057;border-radius:12px;padding:24px;box-shadow:0 30px 80px #000}.card .eyebrow{color:var(--violet);font-size:.75rem;letter-spacing:.14em}.card h2{margin:6px 0 8px}.card p{color:#dfc3ba}.choices{display:grid;gap:8px;margin-top:18px}.choices button{background:#43272d;border:1px solid var(--line);border-radius:7px;padding:12px;text-align:left;cursor:pointer}.choices button:hover{border-color:var(--amber)}.result{text-align:center}.result .score{font-size:3rem;color:var(--amber);margin:5px}.restart{background:var(--mint)!important;color:#152014;text-align:center!important;font-weight:800}
    .help{margin-top:12px;color:#a78078;font-size:.72rem;text-align:center}
    @media(max-width:760px){.shell{padding:12px}.top{align-items:flex-start}.brand{display:block}.brand span{display:block}.meters{grid-template-columns:repeat(2,1fr)}.meter:last-child{grid-column:span 2}.game{grid-template-columns:1fr}.world{min-height:390px}.side{padding:13px}.help{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><b>SPOROCYST</b><span>宿主体内生存シミュレーション</span></div><div class="day">侵入後 <strong id="day">1</strong> / 18日</div></header>
    <section class="meters" aria-label="群体の状態">
      <div class="meter"><label>宿主の健康 <strong id="health">82</strong></label><div class="bar"><i id="healthBar"></i></div></div>
      <div class="meter"><label>利用可能な栄養 <strong id="energy">16</strong></label><div class="bar"><i id="energyBar"></i></div></div>
      <div class="meter"><label>娘スポロシスト <strong id="colony">3</strong></label><div class="bar"><i id="colonyBar"></i></div></div>
      <div class="meter"><label>セルカリア <strong id="cercariae">0</strong></label><div class="bar"><i id="cercariaeBar"></i></div></div>
      <div class="meter"><label>免疫警戒 <strong id="immune">18</strong></label><div class="bar"><i id="immuneBar"></i></div></div>
    </section>
    <section class="game">
      <div class="world">
        <div class="world-head"><b>貝の体内｜消化腺断面</b><small id="maturitySummary">群体の成熟段階を観察中</small></div>
        <canvas id="world" aria-label="貝の体内に広がるスポロシスト群体の模式図"></canvas>
        <div class="legend"><span><i style="background:#9be3a3"></i>スポロシスト（長さ＝成熟度）</span><span><i style="background:#ffd06f"></i>セルカリア</span><span><i style="background:#be83df"></i>超寄生胞子</span><span><i style="background:#ff8a78"></i>免疫反応</span></div>
      </div>
      <aside class="side">
        <div class="brief"><h1 id="phaseTitle">群体を定着させる</h1><p id="phaseText">宿主を殺さず、次世代を生産できる領域を確保してください。毎日ひとつの戦略を選びます。</p></div>
        <div class="actions">
          <button class="action" data-action="expand"><b>娘群体を増やす <em>栄養 −6</em></b><small>増殖期の個体が中心。現在の予測：<span id="expandForecast">0群</span></small></button>
          <button class="action" data-action="produce"><b>セルカリアを形成 <em>栄養 −5</em></b><small>伝播準備が整った個体が中心。現在の予測：<span id="produceForecast">0個体</span></small></button>
          <button class="action" data-action="hide"><b>外皮を調整する <em>栄養 −3</em></b><small>増殖を休み、免疫警戒を下げて宿主を回復させる</small></button>
        </div>
        <button id="release" class="release" disabled>放出にはセルカリアが20必要</button>
        <div class="log"><h2>観察記録</h2><div id="entries" aria-live="polite"></div></div>
      </aside>
    </section>
    <p class="help">目的：18日以内にセルカリアを20以上形成し、宿主が生きている間に放出する。数値はゲーム用の仮想モデルです。</p>
  </main>
  <div class="modal" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="eventTitle"><div class="card"><div class="eyebrow">未知の生物反応</div><h2 id="eventTitle">超寄生者を検出</h2><p id="eventText"></p><div class="choices" id="choices"></div></div></div>
  <div class="modal" id="resultModal" role="dialog" aria-modal="true"><div class="card result"><div class="eyebrow">生活環レポート</div><h2 id="resultTitle"></h2><div class="score" id="score"></div><p id="resultText"></p><div class="choices"><button class="restart" id="restart">新しい群体で試す</button></div></div></div>
  <script>
    const initial={day:1,health:82,energy:16,colony:3,cercariae:0,immune:18,hyperDetected:false,tolerateHyper:false,ended:false}; let s={...initial};
    const $=id=>document.getElementById(id), entries=$('entries'), canvas=$('world'),ctx=canvas.getContext('2d'); let motes=[];
    function log(text){const e=document.createElement('div');e.className='entry new';e.innerHTML=`<time>DAY ${s.day}</time>${text}`;entries.prepend(e);while(entries.children.length>4)entries.lastChild.remove()}
    function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
    function stage(m){return m<.4?'immature':m<.75?'reproductive':'transmission'}
    function productionPower(m){return clamp((m-.4)/.6,0,1)}
    function transmissionPower(m){return clamp((m-.7)/.3,0,1)}
    function daughterPower(m){const base=productionPower(m);return base*(1-.65*transmissionPower(m))}
    function infectionFactor(m){return m.infected?Math.max(.18,1-m.hyperload*.78):1}
    function profile(){const sporo=motes.filter(m=>m.kind==='sporo'),counts={immature:0,reproductive:0,transmission:0},infected=sporo.filter(m=>m.infected);let daughters=0,cercariae=0;sporo.forEach(m=>{const factor=infectionFactor(m);counts[stage(m.maturity)]++;daughters+=daughterPower(m.maturity)*factor;cercariae+=productionPower(m.maturity)*transmissionPower(m.maturity)*factor});return{sporo,counts,infected,daughters,cercariae,hyperLoad:infected.reduce((sum,m)=>sum+m.hyperload,0)}}
    function forecast(power,scale,variance,unit){const low=Math.floor(power*scale),high=Math.floor(power*scale+variance-.001);return low===high?`${low}${unit}`:`${low}〜${high}${unit}`}
    function update(){syncMotes();const p=profile();['health','energy','colony','cercariae','immune'].forEach(k=>{$(k).textContent=Math.round(s[k]);$(k+'Bar').style.width=clamp(s[k],0,k==='colony'?40:k==='cercariae'?50:100)/(k==='colony'?40:k==='cercariae'?50:100)*100+'%'});$('day').textContent=s.day;const hyper=p.infected.length?`・超寄生 ${p.infected.length}`:'';$('maturitySummary').textContent=`未成熟 ${p.counts.immature}・増殖期 ${p.counts.reproductive}・伝播準備 ${p.counts.transmission}${hyper}`;$('expandForecast').textContent=forecast(p.daughters,1.25,1.5,'群');$('produceForecast').textContent=forecast(p.cercariae,2.2,2,'個体');const ready=s.cercariae>=20&&!s.ended;$('release').disabled=!ready;$('release').textContent=ready?'セルカリアを水中へ放出する':`放出にはセルカリアが${Math.max(0,20-Math.floor(s.cercariae))}必要`;document.querySelectorAll('.action').forEach(b=>b.disabled=s.ended)}
    function act(type){if(s.ended)return;const costs={expand:6,produce:5,hide:3};if(s.energy<costs[type]){log('栄養が不足している。宿主からの供給を待つ');advance(true);return} s.energy-=costs[type];
      if(type==='expand'){const p=profile(),gain=Math.floor(p.daughters*1.25+Math.random()*1.5),breeders=p.sporo.filter(m=>productionPower(m.maturity)>0).sort((a,b)=>daughterPower(b.maturity)-daughterPower(a.maturity));breeders.slice(0,Math.max(1,Math.ceil(gain/2))).forEach(m=>m.growthPause=1);s.colony+=gain;s.health-=gain?4+gain:1;s.immune+=gain?7:1;log(gain?`増殖期の個体から娘スポロシストが${gain}群定着。宿主組織への圧力が増した`:'まだ増殖できる成熟度に達していない。資源を成長に回した')}
      if(type==='produce'){const p=profile(),gain=Math.floor(p.cercariae*2.2+Math.random()*2),producers=p.sporo.filter(m=>transmissionPower(m.maturity)>0).sort((a,b)=>b.maturity-a.maturity);producers.slice(0,Math.max(1,Math.ceil(gain/3))).forEach(m=>{m.producingUntil=performance.now()+3600;m.growthPause=1});s.cercariae+=gain;s.health-=gain?2:1;s.immune+=gain?3:1;log(gain?`伝播準備が整った個体から${gain}個体のセルカリア原基を形成した`:'成熟度が足りず、セルカリア原基は形成されなかった')}
      if(type==='hide'){s.immune-=14;s.health+=5;log('外皮の分子構成を調整。宿主の免疫反応が弱まった')}
      advance(false)
    }
    function advance(starved){s.day++;motes.forEach(m=>{if(m.kind!=='sporo')return;if(m.growthPause>0)m.growthPause--;else m.maturity=Math.min(1,m.maturity+.09);if(m.infected){m.hyperload=Math.min(1,m.hyperload+.1);m.maturity=Math.max(.12,m.maturity-.012*m.hyperload)}});const p=profile();s.energy+=Math.max(4,Math.floor(s.health/18));s.health-=Math.max(0,(s.colony-5-p.hyperLoad*.45)*.38);if(p.infected.length&&Math.random()<(s.tolerateHyper?.2:.07)){const target=p.sporo.filter(m=>!m.infected).sort((a,b)=>b.maturity-a.maturity)[0];if(target){target.infected=true;target.hyperload=.16;log('超寄生胞子が隣接するスポロシストへ伝播した')}}if(s.immune>55){const loss=Math.max(1,Math.floor((s.immune-45)/16));s.colony-=loss;log(`免疫細胞の包囲により娘群体を${loss}失った`)}s.immune-=3;
      s.health=clamp(s.health);s.energy=clamp(s.energy,0,40);s.colony=clamp(s.colony,0,40);s.immune=clamp(s.immune);
      if(!s.hyperDetected&&s.day>=5&&s.day<=13&&Math.random()<.23)hyperEvent();else if(s.health<=0||s.colony<=0||s.day>18)finish(false);update()
    }
    function hyperEvent(){const target=profile().sporo.sort((a,b)=>b.maturity-a.maturity)[0];if(!target)return;s.hyperDetected=true;target.infected=true;target.hyperload=.22;const m=$('eventModal');$('eventText').textContent='成熟した娘スポロシスト1個体の内部に、未登録の胞子形成生物を検出しました。紫色の胞子が増えるほど、この個体の増殖力とセルカリア形成力が低下します。';const c=$('choices');c.innerHTML='';[
      ['感染個体から強く排除する','栄養−7／免疫警戒＋12。成功すればこの個体から除去できる。',()=>{s.energy-=7;s.immune+=12;if(Math.random()<.72){target.infected=false;target.hyperload=0;log('感染個体から超寄生胞子を排除した')}else{target.hyperload=.45;log('排除に失敗。対象個体内で胞子負荷が上昇した')}}],
      ['感染個体を低密度で許容する','局所的な生産低下と個体間伝播の危険。弱った個体は宿主消費も減る。',()=>{s.tolerateHyper=true;log('感染個体を群体内に残し、低密度での共存を選んだ')}]
    ].forEach(([a,b,f])=>{const x=document.createElement('button');x.innerHTML=`<b>${a}</b><br><small>${b}</small>`;x.onclick=()=>{f();m.classList.remove('show');update()};c.appendChild(x)});m.classList.add('show')}
    function release(){if(s.cercariae<20)return;const survival=Math.round(s.cercariae*(.12+Math.random()*.12));finish(true,survival)}
    function finish(released,survival=0){s.ended=true;const success=released&&survival>0&&s.health>0;$('resultTitle').textContent=success?'次の宿主へ':'生活環はここで途切れた';$('score').textContent=success?`${survival} 個体`:'0 個体';$('resultText').textContent=success?`${Math.floor(s.cercariae)}個体を放出し、推定${survival}個体が次段階へ到達しました。宿主の残存健康度は${Math.round(s.health)}。個体の死ではなく、世代の連続が成功条件です。`:s.health<=0?'資源を奪いすぎて宿主が死亡し、増殖拠点も失われました。':'放出可能な世代を作る前に時間切れになりました。';$('resultModal').classList.add('show');update()}
    function reset(){s={...initial};motes=[];entries.innerHTML='';$('resultModal').classList.remove('show');log('ミラシジウムが貝へ侵入し、母スポロシストへ変態した');update()}
    function makeMote(kind){return{a:Math.random()*6.28,r:.08+Math.random()*.78,phase:Math.random()*6.28,kind,maturity:kind==='sporo'?.06+Math.random()*.16:1,producingUntil:0,growthPause:0,infected:false,hyperload:0}}
    function syncMotes(){const wantedSporo=Math.round(s.colony),wantedCerc=Math.min(22,Math.round(s.cercariae/2));let sporo=motes.filter(m=>m.kind==='sporo'),cerc=motes.filter(m=>m.kind==='cerc');while(sporo.length<wantedSporo){const m=makeMote('sporo');sporo.push(m)}while(sporo.length>wantedSporo)sporo.pop();while(cerc.length<wantedCerc){const m=makeMote('cerc');cerc.push(m)}while(cerc.length>wantedCerc)cerc.pop();motes=[...sporo,...cerc]}
    function drawHost(w,h,t){
      const bg=ctx.createRadialGradient(w*.53,h*.47,20,w*.53,h*.47,w*.58);bg.addColorStop(0,'#7c4140');bg.addColorStop(.62,'#4b292b');bg.addColorStop(1,'#241519');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
      const cx=w*.53,cy=h*.48,rx=w*.39,ry=h*.36;
      ctx.fillStyle='#aa7a58';ctx.strokeStyle='#deb98a';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(cx,cy,rx*1.08,ry*1.1,-.08,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#683536';ctx.strokeStyle='#d58478';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,rx*.91,ry*.86,-.08,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.save();ctx.globalAlpha=.3;ctx.strokeStyle='#efac91';ctx.lineWidth=2;for(let i=0;i<7;i++){const a=i*.86+t*.006;ctx.beginPath();ctx.ellipse(cx,cy,rx*(.12+i*.105),ry*(.12+i*.09),a*.035,0,Math.PI*1.75);ctx.stroke()}ctx.restore();
      ctx.fillStyle='#b86361';ctx.strokeStyle='#e79a8a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w*.15,h*.76);ctx.bezierCurveTo(w*.3,h*.68,w*.58,h*.76,w*.83,h*.72);ctx.bezierCurveTo(w*.76,h*.86,w*.36,h*.88,w*.16,h*.82);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#bd6e69';ctx.beginPath();ctx.ellipse(w*.18,h*.73,w*.075,h*.075,-.25,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#e8a597';ctx.lineWidth=2;[['.13','.66','.08','.55'],['.2','.65','.22','.53']].forEach(v=>{ctx.beginPath();ctx.moveTo(w*+v[0],h*+v[1]);ctx.quadraticCurveTo(w*(+v[0]-.01),h*(+v[1]-.08),w*+v[2],h*+v[3]);ctx.stroke()});
      ctx.fillStyle='#2b171b';ctx.beginPath();ctx.arc(w*.079,h*.548,2.2,0,Math.PI*2);ctx.arc(w*.222,h*.528,2.2,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#f1b3a0';for(let i=0;i<18;i++){const a=i*2.31,r=.13+(i%5)*.13;ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*rx*r,cy+Math.sin(a*1.17)*ry*r,18+(i%3)*7,9+(i%4)*4,a,0,Math.PI*2);ctx.fill()}ctx.restore();
      return{cx,cy,rx:rx*.82,ry:ry*.75};
    }
    function drawSporocyst(m,x,y,t,now){
      const len=10+m.maturity*18,width=3.2+m.maturity*3.8,bend=Math.sin(t*2.4+m.phase)*3.2,angle=m.phase+Math.sin(t*1.5+m.phase)*.18;
      ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=.62+m.maturity*.32;ctx.fillStyle=m.infected?'#8ebf8f':'#9be3a3';ctx.strokeStyle=m.infected?'#d09be9':'#d4f6c1';ctx.lineWidth=m.maturity>=.75?1.4:.8;ctx.beginPath();ctx.moveTo(-len/2,0);ctx.bezierCurveTo(-len*.28,-width-bend*.18,len*.17,-width+bend*.12,len/2,0);ctx.bezierCurveTo(len*.17,width+bend*.12,-len*.28,width-bend*.18,-len/2,0);ctx.fill();ctx.stroke();
      const germs=1+Math.floor(m.maturity*4);ctx.fillStyle='#467d55';ctx.globalAlpha=.65;for(let i=0;i<germs;i++){const px=-len*.3+i*(len*.6/Math.max(1,germs-1));ctx.beginPath();ctx.ellipse(px,Math.sin(i*2.1+m.phase)*width*.28,1.2+m.maturity*.65,.9+m.maturity*.45,0,0,Math.PI*2);ctx.fill()}
      if(m.infected){const spores=2+Math.floor(m.hyperload*7);ctx.fillStyle='#c987e7';ctx.globalAlpha=.95;for(let i=0;i<spores;i++){const px=-len*.34+(i%4)*len*.22,py=((i%2)*2-1)*width*.43+Math.sin(t*3+i)*1.1;ctx.beginPath();ctx.arc(px,py,1.15+m.hyperload*.55,0,Math.PI*2);ctx.fill()}}
      if(m.producingUntil>now){ctx.fillStyle='#ffd06f';ctx.globalAlpha=.95;for(let i=0;i<3;i++){const a=t*2.2+i*Math.PI*2/3;ctx.beginPath();ctx.arc(Math.cos(a)*(len*.55),Math.sin(a)*(width+4),1.7,0,Math.PI*2);ctx.fill()}}
      ctx.restore();
    }
    function drawCercaria(m,x,y,t){
      const wave=Math.sin(t*5+m.phase),angle=m.phase+t*.08;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=.92;ctx.strokeStyle='#ffe29a';ctx.lineWidth=1.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-2,0);ctx.bezierCurveTo(-7,4*wave,-10,-5*wave,-15,3*wave);ctx.stroke();ctx.fillStyle='#ffd06f';ctx.beginPath();ctx.ellipse(1,0,4.2,2.7,.15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9d6b2d';ctx.beginPath();ctx.arc(2,-.5,.7,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    function drawImmune(cx,cy,rx,ry,t){if(s.immune<=28)return;const n=Math.round(s.immune/12);for(let i=0;i<n;i++){const a=t*.22+i*2.4,x=cx+Math.cos(a)*(rx*.9),y=cy+Math.sin(a*1.3)*(ry*.9),r=4.5;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#ff8a78';ctx.globalAlpha=.5;ctx.beginPath();for(let p=0;p<8;p++){const pa=p*Math.PI/4,pr=r+(p%2?1.8:-.8);const px=Math.cos(pa)*pr,py=Math.sin(pa)*pr;p?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.restore()}}
    function draw(){const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*dpr||canvas.height!==h*dpr){canvas.width=w*dpr;canvas.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const now=performance.now(),t=now/1600,host=drawHost(w,h,t);motes.forEach(m=>{m.a+=m.kind==='cerc'?.0032:.0011;const drift=.35+.65*m.maturity,x=host.cx+Math.cos(m.a+t*.045)*(host.rx*m.r)+Math.sin(t+m.phase)*5*drift,y=host.cy+Math.sin(m.a*1.4)*(host.ry*m.r);m.kind==='cerc'?drawCercaria(m,x,y,t):drawSporocyst(m,x,y,t,now)});drawImmune(host.cx,host.cy,host.rx,host.ry,t);ctx.globalAlpha=1;requestAnimationFrame(draw)}
    document.querySelectorAll('.action').forEach(b=>b.onclick=()=>act(b.dataset.action));$('release').onclick=release;$('restart').onclick=reset;reset();draw();
    if(document.modelContext?.registerTool){
      const state=()=>{const p=profile();return{day:s.day,hostHealth:Math.round(s.health),energy:Math.round(s.energy),daughterSporocysts:Math.round(s.colony),maturityStages:p.counts,daughterProductionPower:Number(p.daughters.toFixed(2)),cercariaProductionPower:Number(p.cercariae.toFixed(2)),cercariae:Math.round(s.cercariae),immuneAlert:Math.round(s.immune),hyperparasitePresent:p.infected.length>0,infectedSporocysts:p.infected.length,hyperparasiteLoad:Number(p.hyperLoad.toFixed(2)),canRelease:s.cercariae>=20&&!s.ended,ended:s.ended}};
      document.modelContext.registerTool({name:'read_colony_state',title:'群体の状態を読む',description:'現在のスポロシスト群体、宿主、免疫、超寄生の状態を返す。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>state()});
      document.modelContext.registerTool({name:'choose_colony_strategy',title:'今日の戦略を選ぶ',description:'画面のボタンと同じ一日分の戦略を実行する。',inputSchema:{type:'object',properties:{strategy:{type:'string',enum:['expand','produce','hide']}},required:['strategy'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({strategy})=>{if(!['expand','produce','hide'].includes(strategy))throw new Error('未知の戦略');act(strategy);return state()}});
      document.modelContext.registerTool({name:'release_cercariae',title:'セルカリアを放出する',description:'セルカリアが20以上なら水中へ放出し、生活環の成否を判定する。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{if(s.cercariae<20||s.ended)throw new Error('まだ放出できない');release();return state()}});
    }
  </script>
